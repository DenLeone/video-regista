name: bot

# Pubblica il bot Telegram (Cloudflare Worker) quando cambia telegram/ su main,
# oppure a mano dal tab Actions (anche da un altro ramo).
# Serve una volta sola: secret CLOUDFLARE_API_TOKEN (modello "Edit Cloudflare Workers");
# l'account è in telegram/wrangler.toml. Senza secret il job finisce con un avviso, non fallisce.
on:
  push:
    branches: [main]
    paths: ['telegram/**']
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Tipi e test dell'app
        run: |
          npx --yes -p typescript@5.9.3 tsc -p telegram/tsconfig.json --noEmit
          node --experimental-strip-types --import ./telegram/test/register.mjs --test telegram/test/*.test.ts

      - name: Pubblica su Cloudflare
        working-directory: telegram
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::Manca il secret CLOUDFLARE_API_TOKEN: bot non pubblicato (pubblicalo a mano con npx wrangler deploy)"
            exit 0
          fi
          # secret CLOUDFLARE_ACCOUNT_ID vuoto: vale account_id di wrangler.toml
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || unset CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4 deploy
