name: studia-video

# 🔎 Studia un video da Drive (19/11): trascrizione + fogli di fotogrammi in 30 · Sviluppo/_studio/<id>,
# per i video troppo grandi da guardare in chat. Input: l'id del file su Drive.
run-name: '🔎 Studio video'
on:
  workflow_dispatch:
    inputs:
      id:
        description: 'id del video su Google Drive'
        required: true

permissions:
  contents: read

jobs:
  studia:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cache strumenti
        uses: actions/cache@v5
        with:
          path: ~/opt/regista-strumenti
          key: regista-strumenti-v2-${{ runner.os }}
      - name: Drive e ffmpeg
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          command -v ffmpeg > /dev/null || bash scripts/programma-video.sh
          command -v rclone > /dev/null || for i in 1 2 3; do timeout 60 bash -c 'curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null' && break; sleep 5; done
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" | tr -d '\r' | sed -e '1s/^\xEF\xBB\xBF//' -e 's/^[[:space:]]*//' > ~/.config/rclone/rclone.conf
      - name: Studio
        env:
          ID: ${{ inputs.id }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          mkdir -p in
          rclone backend copyid gdrive: "$ID" in/ > /dev/null
          f=$(ls in | head -1)
          node scripts/studia-video.mjs "in/$f" out
          rclone copy out "gdrive:30 · Sviluppo/_studio/$ID" > /dev/null
          echo "su Drive: 30 · Sviluppo/_studio/$ID"
