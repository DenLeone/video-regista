name: stile

# Studia uno stile dal video di riferimento intero (scripts/studia-stile.mjs). Lo avvia il bot
# quando nell'app "Studia uno stile" il file è arrivato su R2; l'esito torna al bot (/stile-esito),
# che lo mette nell'app come bozza e avvisa su Telegram. Nessun montaggio parte da qui.
on:
  workflow_dispatch:
    inputs:
      r2:
        description: 'ID del caricamento su R2 (inbox/<id>/) con il video di riferimento'
        required: false
      drive:
        description: 'In alternativa (prove): percorso di un video su Drive, es. 12 · Risorse/Stili/Motion /esempio.mp4'
        required: false
      salva:
        description: 'Con drive: salva lo stile su Drive in Stili/<nome> (per provarlo subito)'
        required: false

concurrency:
  group: stile-${{ inputs.r2 || inputs.drive }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  studia:
    runs-on: ubuntu-24.04
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cache strumenti
        uses: actions/cache@v4
        with:
          path: ~/opt/regista-strumenti
          key: regista-strumenti-v2-${{ runner.os }}

      - name: Programmi
        timeout-minutes: 16
        run: |
          bash scripts/apt-ubuntu.sh ffmpeg
          bash scripts/installa-strumenti.sh
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null

      - name: Drive (solo per le prove da Drive)
        if: inputs.drive != ''
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - name: Studia
        id: studia
        env:
          R2_ID: ${{ inputs.r2 }}
          STILE_DRIVE: ${{ inputs.drive }}
          STILE_SALVA_DRIVE: ${{ inputs.salva }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: node scripts/studia-stile.mjs

      - name: Conserva lo stile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stile
          path: |
            work/studio-stile/stile.txt
            work/studio-stile/esito.json
          if-no-files-found: ignore
          retention-days: 7

      # si è fermato prima dello script (installazione): l'app non resta "in analisi" per sempre
      - name: Avvisa il bot se si è fermato prima
        if: failure() && steps.studia.outcome != 'failure' && inputs.r2 != ''
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          R2_ID: ${{ inputs.r2 }}
        run: |
          [ -n "$NOTIFY_URL" ] || exit 0
          jq -n --arg r "$R2_ID" '{r2: $r, ok: false, errore: "lo studio si è fermato su GitHub prima di finire: riprova"}' \
            | curl -s -X POST "${NOTIFY_URL%/notify}/stile-esito" -H 'content-type: application/json' -H "x-regista-token: $NOTIFY_TOKEN" -d @- > /dev/null || true
