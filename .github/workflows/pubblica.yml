name: pubblica

# Avviato dal bot Telegram (📤 Pubblica): Instagram come reel di prova e YouTube Shorts,
# poi il video passa in 99 - Pubblicare e il bot riceve i link. Niente render: 2–3 minuti.
# Secret: RCLONE_CONF, NOTIFY_URL, NOTIFY_TOKEN (già presenti); YT_CLIENT_ID, YT_CLIENT_SECRET,
# YT_REFRESH_TOKEN per YouTube. La chiave di Instagram la custodisce il bot (IG_TOKEN su Cloudflare).
on:
  workflow_dispatch:
    inputs:
      dati:
        description: 'JSON dal bot: nonce, nome, file, fileId, didascalia, titolo, copertina, ig, yt, prova'
        required: true

concurrency:
  group: pubblica
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pubblica:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Drive (rclone)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Pubblica
        env:
          DATI: ${{ inputs.dati }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/pubblica.mjs

      # se il giro si ferma prima che lo script avvisi il bot, la scheda non resta "in corso"
      - name: Avvisa il bot dell'errore
        if: failure()
        env:
          DATI: ${{ inputs.dati }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -f work/pubblicato.json ] && exit 0
          [ -n "$NOTIFY_URL" ] || exit 0
          jq -n --argjson d "$DATI" --arg url "$RUN_URL" '{tipo: "pubblicato", nonce: $d.nonce, nome: $d.nome, run_url: $url, errore: "il giro di pubblicazione si è fermato prima di finire"}' \
            | curl -s -X POST "$NOTIFY_URL" -H 'content-type: application/json' -H "x-regista-token: $NOTIFY_TOKEN" -d @- > /dev/null || true
