name: rinomina

# Rinomina file in una cartella di 05 · Archivio (scripts/rinomina.mjs). Mappa JSON {"vecchio":"nuovo"}. Niente si cancella,
# niente si sovrascrive; il file resta lo stesso (stesso ID). Nel log (repo pubblico) solo il numero dei file.
run-name: ${{ format('rinomina · {0}', inputs.chi || 'Claude') }}
on:
  workflow_dispatch:
    inputs:
      cartella:
        description: 'Cartella dentro 05 · Archivio'
        required: true
      mappa:
        description: 'JSON {"nome vecchio":"nome nuovo"}'
        required: true
      chi:
        description: 'Chi lo lancia (solo per il nome del giro)'
        required: false
        default: 'Claude'

concurrency:
  group: rinomina
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rinomina:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Collego Drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" | tr -d '\r' | sed -e '1s/^\xEF\xBB\xBF//' -e 's/^[[:space:]]*//' > ~/.config/rclone/rclone.conf

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Rinomina
        env:
          CARTELLA: ${{ inputs.cartella }}
          MAPPA: ${{ inputs.mappa }}
        run: node scripts/rinomina.mjs
