name: laboratorio

# Prove del look sul girato vero (scripts/laboratorio.mjs): niente montaggio, niente notifiche.
# Si avvia a mano (Actions → laboratorio → Run workflow) scegliendo il ramo e la ricetta.
on:
  workflow_dispatch:
    inputs:
      ricetta:
        description: 'Ricetta (file JSON nel repo, es. lab/12k-catalogo.json)'
        required: true
        default: 'lab/ricetta.json'

concurrency:
  group: laboratorio-${{ inputs.ricetta }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Drive (rclone)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone lsf "gdrive:98 - Fatti" --dirs-only > /dev/null && echo "Drive OK"

      - name: ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prove
        env:
          RICETTA: ${{ inputs.ricetta }}
        run: node scripts/laboratorio.mjs
