name: laboratorio

# Prove del look sul girato vero (scripts/laboratorio.mjs): niente montaggio, niente notifiche.
# Si avvia a mano (Actions → laboratorio → Run workflow) scegliendo il ramo e la ricetta.
on:
  workflow_dispatch:
    inputs:
      ricetta:
        description: 'Ricetta (file JSON nel repo, es. lab/12k-catalogo.json)'
        required: true
        default: 'lab/12k-varianti.json'

# cartelle di Drive (rinominate da Denis il 20/10): le legge anche scripts/cartelle.mjs
env:
  DIR_EDITARE: '01 · Da editare'
  DIR_FATTI: '02 · Fatti'
  DIR_PUBBLICARE: '03 · Da pubblicare'
  DIR_STILI: '12 · Risorse/Stili'

concurrency:
  group: laboratorio-${{ inputs.ricetta }}
  cancel-in-progress: false

# write: i confronti leggeri vanno anche sul ramo laboratorio-esiti (si guardano da git, senza Drive)
permissions:
  contents: write

jobs:
  prova:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Drive (rclone)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone lsf "gdrive:$DIR_FATTI" --dirs-only > /dev/null && echo "Drive OK"

      - name: Cache strumenti
        uses: actions/cache@v4
        with:
          path: ~/opt/regista-strumenti
          key: regista-strumenti-v2-${{ runner.os }}

      - name: ffmpeg
        timeout-minutes: 16
        run: |
          bash scripts/apt-ubuntu.sh ffmpeg fonts-dejavu-core
          bash scripts/installa-strumenti.sh

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Prove
        env:
          RICETTA: ${{ inputs.ricetta }}
          # il girato si scarica nel disco grande del runner (/mnt), un file alla volta
          LAB_SCARICO: /mnt/lab
        run: |
          sudo mkdir -p /mnt/lab && sudo chown "$USER" /mnt/lab
          node scripts/laboratorio.mjs

      - name: Confronti sul ramo laboratorio-esiti-<ricetta>
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RICETTA: ${{ inputs.ricetta }}
        run: |
          [ -d work/lab-git ] || exit 0
          cd work/lab-git
          git init -q -b laboratorio-esiti
          git add -A
          git -c user.name='laboratorio' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qm "laboratorio: $RICETTA"
          # un ramo per ricetta: due prove in parallelo non si cancellano a vicenda
          ramo="laboratorio-esiti-$(basename "$RICETTA" .json)"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "laboratorio-esiti:$ramo"
