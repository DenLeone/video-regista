name: regista

on:
  workflow_dispatch:          # avvio dal bot, dall'app o dal tab Actions
    inputs:
      cartella:
        description: 'Cartella in 01 · Da editare (vuoto = la prima con VAI)'
        required: false
        default: ''
      brief:
        description: 'Brief al volo (aggiunto a brief.txt)'
        required: false
        default: ''
      origine:
        description: '97 = nuovo montaggio da 01 · Da editare, 98 = rifai/correggi un video in 02 · Fatti'
        required: false
        default: '97'
      correzione:
        description: 'Cosa cambiare rispetto al montaggio precedente (solo con origine 98)'
        required: false
        default: ''
      ai:
        description: 'AI principale: gemini | claude (l''altra fa da riserva) — vuoto = variabile REGISTA_AI, poi gemini'
        required: false
        default: ''
      modello:
        description: 'Modello Claude: sonnet | opus | haiku — vuoto = variabile REGISTA_MODEL (default sonnet)'
        required: false
        default: ''
      modello_gemini:
        description: 'Modello Gemini: flash | pro — vuoto = variabile GEMINI_MODEL (default flash)'
        required: false
        default: ''
      azione:
        description: 'monta (default) | elenco = manda solo al bot le cartelle di 01 · Da editare | regia = prova veloce della sola regia (testo, niente render) su una cartella già montata | render = rifà solo il render con la regia salvata (origine 98) | esempi = fogli di fotogrammi degli esempi di uno stile (cartella = nome dello stile) | archivio = copia su Drive i file caricati dall''app, senza montare'
        required: false
        default: 'monta'
      r2:
        description: 'Id del caricamento dall''app (R2). Il runner scarica da lì e copia gli originali in 01 · Da editare'
        required: false
        default: ''
      telegram:
        description: 'File mandati al bot (JSON [{"m": id_messaggio, "n": nome}]): originali in 97/<cartella>, risultato in 98/<cartella>'
        required: false
        default: ''
      secondi:
        description: 'Render di prova: solo i primi N secondi del montaggio (vuoto = tutto)'
        required: false
        default: ''
      tentativo:
        description: 'Interno, non cambiare. 1 = primo giro, 2 = rilancio automatico se il server ha fallito'
        required: false
        default: '1'

# cartelle di Drive (rinominate da Denis il 20/10): le legge anche scripts/cartelle.mjs
env:
  DIR_EDITARE: '01 · Da editare'
  DIR_FATTI: '02 · Fatti'
  DIR_PUBBLICARE: '03 · Da pubblicare'
  DIR_STILI: '12 · Risorse/Stili'

# Una coda PER CARTELLA: GitHub tiene un solo giro "in attesa" per gruppo e scarta
# quelli in attesa più vecchi. Con un gruppo unico, tre avvii di fila ne perdevano uno.
# Cartelle diverse girano in parallelo. Senza nome di cartella, e l'elenco, hanno la loro coda.
concurrency:
  group: regista-${{ inputs.azione == 'elenco' && 'elenco' || (inputs.azione == 'regia' || inputs.azione == 'esempi') && format('{0}-{1}', inputs.azione, inputs.cartella) || inputs.cartella || 'auto' }}
  cancel-in-progress: false

# senza nome di cartella, lo script avvia un giro per ogni cartella con VAI (gh workflow run)
permissions:
  contents: read
  actions: write

jobs:
  monta:
    # versione fissa: ubuntu-latest passa a Ubuntu 26 dal 19/10/2026 (ffmpeg, font, dipendenze di Chrome)
    runs-on: ubuntu-24.04
    # un giro fermo (mirror, modello che non risponde) non tiene il runner per 4 ore
    timeout-minutes: 45
    # bash anche dentro l'immagine: gli step usano mapfile. Sulla macchina è già bash.
    defaults:
      run:
        shell: bash
    # Spenta di default. image null = il giro resta sulla macchina, come oggi.
    # Si accende solo con la variabile del repository USA_IMMAGINE=1, quando
    # ghcr.io/denleone/video-regista-runner:latest è pubblica. /mnt è il disco
    # grande; shm da 2g evita che Chrome di Remotion muoia nel container.
    container: ${{ fromJSON(vars.USA_IMMAGINE == '1' && '{"image":"ghcr.io/denleone/video-regista-runner:latest","volumes":["/mnt:/mnt"],"options":"--shm-size=2g"}' || '{"image":null}') }}
    steps:
      - uses: actions/checkout@v5

      # Prima di apt e di Drive: se manca una chiave il giro si ferma subito e Telegram
      # lo dice ora, senza aspettare il quarto d'ora dell'installazione. Non è un errore
      # del server: non si rilancia.
      - name: Chiavi
        id: chiavi
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AZIONE: ${{ inputs.azione }}
          TELEGRAM: ${{ inputs.telegram }}
          R2: ${{ inputs.r2 }}
          CARTELLA: ${{ inputs.cartella }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          manca=()
          [ -n "$RCLONE_CONF" ] || manca+=("RCLONE_CONF (Drive)")
          if [ "$AZIONE" != "elenco" ] && [ "$AZIONE" != "archivio" ]; then
            [ -n "$GEMINI_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || manca+=("GEMINI_API_KEY o CLAUDE_CODE_OAUTH_TOKEN")
            [ -n "$GROQ_API_KEY" ] || manca+=("GROQ_API_KEY")
          fi
          if [ -n "$TELEGRAM" ] && [ "$TELEGRAM" != "[]" ]; then
            [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ] && [ -n "$TELEGRAM_BOT_TOKEN" ] || manca+=("TG_API_ID, TG_API_HASH e TELEGRAM_BOT_TOKEN")
          fi
          if [ -n "$R2" ]; then
            [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ] || manca+=("R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY e R2_BUCKET")
          fi
          if [ ${#manca[@]} -eq 0 ]; then
            echo "chiavi ok"
            exit 0
          fi
          echo "mancano=1" >> "$GITHUB_OUTPUT"
          testo="Mancano delle chiavi su GitHub Actions: ${manca[*]}. Il giro non parte."
          echo "::error::$testo"
          if [ -n "$NOTIFY_URL" ]; then
            jq -n --arg n "${CARTELLA:-—}" --arg u "$RUN_URL" --arg id "$GITHUB_RUN_ID" --arg t "$testo" \
              '{tipo:"esito", esito:"⚠️ non montato", nome:$n, ok:false, run_url:$u, run_id:$id, testo:("Errore: "+$t), info:{errore:$t}}' \
              | curl -s -X POST "$NOTIFY_URL" -H 'content-type: application/json' -H "x-regista-token: $NOTIFY_TOKEN" -d @- > /dev/null || true
          fi
          exit 1

      - name: Drive (rclone)
        id: drive
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          # nell'immagine c'è già; sulla macchina si installa come prima
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://rclone.org/install.sh | sudo bash > /dev/null
          fi
          mkdir -p ~/.config/rclone
          # via env + printf: il token è JSON con virgolette, echo "..." le rovinerebbe
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf
          rclone lsf "gdrive:$DIR_EDITARE" --dirs-only > /dev/null && echo "Drive OK"

      - name: C'è qualcosa da fare?
        id: check
        env:
          CARTELLA: ${{ inputs.cartella }}
          AZIONE: ${{ inputs.azione }}
          ORIGINE: ${{ inputs.origine }}
          CORREZIONE: ${{ inputs.correzione }}
          TELEGRAM: ${{ inputs.telegram }}
          R2: ${{ inputs.r2 }}
          EVENTO: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          # solo vero/falso (il valore resta segreto): il bot mostra se YouTube è collegato
          YT_PRONTO: ${{ secrets.YT_CLIENT_ID != '' && secrets.YT_CLIENT_SECRET != '' && secrets.YT_REFRESH_TOKEN != '' }}
        run: |
          mapfile -t cartelle < <(rclone lsf "gdrive:$DIR_EDITARE" --dirs-only | sed 's:/$::')
          declare -A vai_di=()
          con_vai=()
          for d in "${cartelle[@]}"; do
            f=$(rclone lsf "gdrive:$DIR_EDITARE/$d" --files-only | grep -iE '^vai(\.[^.]+)?$' | head -n1 || true)
            if [ -n "$f" ]; then con_vai+=("$d"); vai_di["$d"]="$f"; fi
          done
          # prenoto il VAI subito: un giro successivo non riprende la stessa cartella
          prenota() { rclone moveto "gdrive:$DIR_EDITARE/$1/${vai_di[$1]}" "gdrive:$DIR_EDITARE/$1/_VAI_in_corso_${vai_di[$1]}" && echo "Prenotata: $1"; }
          # "Manifestazioni " e "Anime" arrivano dal bot senza lo spazio: si confronta dopo, sul nome vero
          CARTELLA=$(printf '%s' "$CARTELLA" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
          trovato="$CARTELLA"
          # file da Telegram: la cartella la crea lo script (nome libero in 97 e 98)
          [ -n "$TELEGRAM" ] && [ "$TELEGRAM" != "[]" ] && trovato="${CARTELLA:-Video da Telegram}"
          # l'apostrofo non può stare dentro ${var:-...}: bash non chiude la parentesi e lo step non parte
          if [ -n "$R2" ] && [ -z "$trovato" ]; then trovato="Video dall'app"; fi
          liberi=("${con_vai[@]}")
          if [ "$AZIONE" != "elenco" ] && [ "$AZIONE" != "regia" ] && [ "$AZIONE" != "esempi" ] && [ -z "$trovato" ] && [ ${#con_vai[@]} -gt 0 ]; then
            trovato="${con_vai[0]}"
            prenota "$trovato" || true
            # tutte le altre cartelle con VAI partono subito, ognuna nel suo giro (in parallelo)
            for d in "${con_vai[@]:1}"; do
              if prenota "$d"; then gh workflow run regista.yml --ref "$GITHUB_REF_NAME" -f cartella="$d" && echo "Avviata in parallelo: $d"; fi
            done
            liberi=()
          fi
          # nome scritto a mano: deve esistere prima di apt. VAI non serve. Telegram, R2,
          # elenco, esempi e archivio creano o non cercano la cartella in 01.
          if [ -n "$CARTELLA" ] && [ "$AZIONE" != "elenco" ] && [ "$AZIONE" != "esempi" ] && [ "$AZIONE" != "archivio" ] \
             && { [ -z "$TELEGRAM" ] || [ "$TELEGRAM" = "[]" ]; } && [ -z "$R2" ]; then
            cerca() {
              local dir="$1" elenco stato
              elenco=$(rclone lsf "gdrive:$dir" --dirs-only) || return 1
              printf '%s\n' "$elenco" | python3 scripts/nome-cartella.py "$CARTELLA"
            }
            vero=""
            stato=0
            if [ "$AZIONE" = "regia" ]; then
              vero=$(cerca "$DIR_FATTI") || stato=$?
              # 2 = non c'è in Fatti: si guarda anche in Da editare. Un errore di Drive (1) si rilancia.
              if [ "$stato" = 2 ]; then
                stato=0
                vero=$(cerca "$DIR_EDITARE") || stato=$?
              fi
              dove="né in $DIR_FATTI né in $DIR_EDITARE"
            elif [ "$ORIGINE" = "98" ] || [ -n "$CORREZIONE" ]; then
              vero=$(cerca "$DIR_FATTI") || stato=$?
              dove="in $DIR_FATTI"
            else
              vero=$(cerca "$DIR_EDITARE") || stato=$?
              dove="in $DIR_EDITARE"
            fi
            ferma=""
            if [ "$stato" = 0 ] && [ -n "$vero" ]; then
              trovato="$vero"
              [ "$trovato" = "$CARTELLA" ] || echo "cartella \"$CARTELLA\" trovata come \"$trovato\""
            elif [ "$stato" = 2 ] || [ "$stato" = 3 ]; then
              echo "mancante=1" >> "$GITHUB_OUTPUT"
              trovato=""
              ferma=manca
              if [ "$stato" = 3 ]; then
                testo_manca="Due cartelle combaciano con \"$CARTELLA\" $dove. Rinomina una delle due: non monto."
              else
                testo_manca="Non trovo la cartella \"$CARTELLA\" $dove. Spazi in più e le maiuscole non contano."
              fi
              echo "::error::$testo_manca"
            else
              echo "::error::non riesco a leggere le cartelle su Drive"
              exit 1
            fi
          fi
          # lo spazio in fondo del nome vero (Manifestazioni ) non va tagliato
          {
            echo "cartella<<REGISTA_CARTELLA_END"
            printf '%s\n' "$trovato"
            echo "REGISTA_CARTELLA_END"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$trovato" ]; then echo "Da montare: $trovato"
          elif [ "${ferma:-}" = "manca" ]; then echo "cartella assente: mi fermo prima di apt"
          else echo "Niente da fare"; fi
          # il bot tiene l'elenco delle cartelle per i tasti di "Nuovo montaggio" e degli stili su Drive
          # (cartelle in Stili, tranne quelle che iniziano con "_" come il modello): nome, cartella e
          # la riga "Quando usarlo" di stile.txt, che il bot mostra come descrizione
          STILI_DIR="gdrive:$DIR_STILI"
          stili_info=$(rclone lsjson "$STILI_DIR" --dirs-only 2>/dev/null | jq -c '[.[] | select(.Name | startswith("_") | not) | {nome: .Name, id: .ID}]') || stili_info='[]'
          [ -n "$stili_info" ] || stili_info='[]'
          rclone copy "$STILI_DIR" "$RUNNER_TEMP/stili" --include '/*/stile.txt' 2>/dev/null || true
          for f in "$RUNNER_TEMP"/stili/*/stile.txt; do
            [ -f "$f" ] || continue
            d=$(grep -aim1 '^quando usarlo' "$f" | sed 's/^[^:]*:[[:space:]]*//; s/\r$//; s/[[:space:]]*$//' || true)
            case "$d" in ''|'('*) continue ;; esac
            stili_info=$(jq -c --arg s "$(basename "$(dirname "$f")")" --arg d "$d" 'map(if .nome == $s then . + {desc: $d} else . end)' <<< "$stili_info")
          done
          mapfile -t stili < <(jq -r '.[].nome' <<< "$stili_info")
          if [ -n "$NOTIFY_URL" ]; then
            jq -n --args '{tipo:"cartelle", cartelle:$ARGS.positional}' -- "${cartelle[@]}" \
              | jq --args '. + {vai:$ARGS.positional}' -- "${liberi[@]}" \
              | jq --args '. + {stili:$ARGS.positional}' -- "${stili[@]}" \
              | jq --argjson info "$stili_info" --argjson yt "${YT_PRONTO:-false}" '. + {stili_info:$info, yt:$yt}' \
              | curl -s -X POST "$NOTIFY_URL" -H 'content-type: application/json' -H "x-regista-token: $NOTIFY_TOKEN" -d @- > /dev/null || true
          fi
          # cartella chiesta e assente: l'elenco dei tasti è già partito, ora l'errore. Niente apt.
          if [ "${ferma:-}" = "manca" ]; then
            if [ -n "$NOTIFY_URL" ]; then
              jq -n --arg n "$CARTELLA" --arg u "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --arg id "$GITHUB_RUN_ID" --arg t "$testo_manca" \
                '{tipo:"esito", esito:"⚠️ non montato", nome:$n, richiesto:$n, ok:false, run_url:$u, run_id:$id, testo:("Errore: "+$t), info:{errore:$t}}' \
                | curl -s -X POST "$NOTIFY_URL" -H 'content-type: application/json' -H "x-regista-token: $NOTIFY_TOKEN" -d @- > /dev/null || true
            fi
            exit 1
          fi
          # avvio manuale/dal bot senza niente da montare: avvisa, così non sembra un video fatto
          if [ -z "$trovato" ] && [ "$AZIONE" != "elenco" ] && [ "$EVENTO" = "workflow_dispatch" ] && [ -n "$NOTIFY_URL" ]; then
            jq -n --arg t "Nessuna cartella con VAI in $DIR_EDITARE: non ho montato niente." '{tipo: "vuoto", nome: "—", testo: $t}' \
              | curl -s -X POST "$NOTIFY_URL" -H 'content-type: application/json' -H "x-regista-token: $NOTIFY_TOKEN" -d @- > /dev/null
          fi

      - uses: actions/setup-node@v5
        if: vars.USA_IMMAGINE != '1' && steps.check.outputs.cartella != ''
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        if: vars.USA_IMMAGINE != '1' && steps.check.outputs.cartella != '' && inputs.telegram != '' && inputs.telegram != '[]'
        with:
          python-version: '3.12'

      - name: Cache strumenti
        # stessa chiave di stile.yml, laboratorio.yml e del giro «strumenti»: un solo scarico
        if: vars.USA_IMMAGINE != '1' && steps.check.outputs.cartella != '' && inputs.azione != 'regia' && inputs.azione != 'archivio'
        uses: actions/cache@v4
        with:
          path: ~/opt/regista-strumenti
          key: regista-strumenti-v2-${{ runner.os }}

      - name: Dipendenze
        id: dipendenze
        # la prova della sola regia non tocca video: niente ffmpeg né Remotion
        if: steps.check.outputs.cartella != '' && inputs.azione != 'regia' && inputs.azione != 'archivio'
        # di solito ~30 s; il 22/10 un mirror di Ubuntu bloccato l'ha tenuto fermo 20 minuti
        timeout-minutes: 16
        env:
          TELEGRAM: ${{ inputs.telegram }}
          USA_IMMAGINE: ${{ vars.USA_IMMAGINE }}
        run: |
          if [ "$USA_IMMAGINE" = "1" ]; then
            # pacchetti, ffmpeg e browser sono già nell'immagine
            bash scripts/collega-immagine.sh
          else
            # Prima il ffmpeg in cache (GitHub). Apt solo se quel ffmpeg non parte, e per emoji/libegl
            # se dpkg non li ha già. Un apt fermo su quei pacchetti non ferma il montaggio.
            bash scripts/programma-video.sh fonts-noto-color-emoji libegl1 libgles2
            npm ci || npm install
            # Telethon (MTProto) per scaricare i file grandi mandati al bot; cryptg lo rende molto più veloce
            if [ -n "$TELEGRAM" ] && [ "$TELEGRAM" != "[]" ]; then pip install --quiet telethon cryptg; fi
          fi
          # il girato originale va nel disco grande del runner (/mnt), non in quello di sistema
          sudo mkdir -p /mnt/regista && sudo chown "$USER" /mnt/regista
          df -h / /mnt | sed 's/^/  /'
          # Claude Code si installa da solo solo se serve (Gemini è l'AI principale)

      - name: Prova dei tagli in parallelo
        # Stesso test del bot. Lì ffmpeg non c'è e il test si salta; qui c'è e non deve saltare.
        if: steps.check.outputs.cartella != '' && inputs.azione != 'regia' && inputs.azione != 'archivio'
        run: |
          node --experimental-strip-types --import ./telegram/test/register.mjs --test --test-reporter=tap telegram/test/tagli-paralleli.test.ts | tee /tmp/tagli-prova.tap
          if grep -q '# SKIP' /tmp/tagli-prova.tap; then
            echo "::error::la prova dei tagli è stata saltata: serve ffmpeg con libx264"
            exit 1
          fi

      - name: Monta
        id: monta
        if: steps.check.outputs.cartella != ''
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # AI principale di default; se manca si usa Claude
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # B-roll di repertorio degli stili con "B-roll stock: sì" (facoltative: pixabay.com/api/docs, chiave gratuita)
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          # scelte dal bot, altrimenti Settings → Secrets and variables → Actions → Variables (facoltative)
          REGISTA_AI: ${{ inputs.ai || vars.REGISTA_AI }}
          REGISTA_MODEL: ${{ inputs.modello || vars.REGISTA_MODEL }}
          GEMINI_MODEL: ${{ inputs.modello_gemini || vars.GEMINI_MODEL }}
          REGISTA_VERSIONE: ${{ github.ref_name }}
          REGISTA_SCARICO: /mnt/regista/in
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          CARTELLA: ${{ steps.check.outputs.cartella }}
          TELEGRAM_FILE: ${{ inputs.telegram }}
          R2_ID: ${{ inputs.r2 }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          # una volta sola: api_id/api_hash da my.telegram.org e il token del bot
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BRIEF_EXTRA: ${{ inputs.brief }}
          ORIGINE: ${{ inputs.origine }}
          CORREZIONE: ${{ inputs.correzione }}
          AZIONE: ${{ inputs.azione }}
          PROVA_SECONDI: ${{ inputs.secondi }}
        run: |
          # l'archivio non installa i pacchetti: la cartella sul disco grande va creata lo stesso
          sudo mkdir -p /mnt/regista && sudo chown "$USER" /mnt/regista
          node scripts/regista.mjs

      # Chiavi mancanti e cartella inesistente hanno già avvisato e non si rilanciano.
      # Lo script, se parte e fallisce, avvisa lui. Qui resta il resto: apt, Drive, immagine.
      # È un errore del server: si rilancia una volta sola, e Telegram parte solo se fallisce anche il secondo.
      - name: È un errore del server?
        id: causa
        if: failure()
        env:
          CHIAVI: ${{ steps.chiavi.outcome }}
          MANCANTE: ${{ steps.check.outputs.mancante }}
          MONTA: ${{ steps.monta.outcome }}
        run: |
          infra=1
          if [ "$CHIAVI" = "failure" ] || [ "$MANCANTE" = "1" ] || [ "$MONTA" = "failure" ]; then
            infra=0
          fi
          echo "infra=$infra" >> "$GITHUB_OUTPUT"
          if [ "$infra" = 1 ]; then echo "errore del server"; else echo "errore del contenuto, niente rilancio"; fi

      - name: Rilancio se è un errore del server
        id: rilancio
        if: failure() && steps.causa.outputs.infra == '1' && inputs.tentativo != '2'
        env:
          GH_TOKEN: ${{ github.token }}
          CARTELLA: ${{ inputs.cartella }}
          BRIEF: ${{ inputs.brief }}
          ORIGINE: ${{ inputs.origine }}
          CORREZIONE: ${{ inputs.correzione }}
          AI: ${{ inputs.ai }}
          MODELLO: ${{ inputs.modello }}
          MODELLO_GEMINI: ${{ inputs.modello_gemini }}
          AZIONE: ${{ inputs.azione }}
          R2: ${{ inputs.r2 }}
          TELEGRAM: ${{ inputs.telegram }}
          SECONDI: ${{ inputs.secondi }}
        run: |
          if ! command -v gh >/dev/null 2>&1; then
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::error::gh non c'è, non posso rilanciare"
            exit 1
          fi
          if jq -n \
            --arg ref "$GITHUB_REF_NAME" \
            --arg cartella "$CARTELLA" --arg brief "$BRIEF" --arg origine "$ORIGINE" \
            --arg correzione "$CORREZIONE" --arg ai "$AI" --arg modello "$MODELLO" \
            --arg modello_gemini "$MODELLO_GEMINI" --arg azione "$AZIONE" \
            --arg r2 "$R2" --arg telegram "$TELEGRAM" --arg secondi "$SECONDI" \
            '{ref:$ref, inputs:{cartella:$cartella, brief:$brief, origine:$origine, correzione:$correzione, ai:$ai, modello:$modello, modello_gemini:$modello_gemini, azione:$azione, r2:$r2, telegram:$telegram, secondi:$secondi, tentativo:"2"}}' \
            | gh api --method POST "/repos/${GITHUB_REPOSITORY}/actions/workflows/regista.yml/dispatches" --input -; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
            echo "rilancio avviato (tentativo 2): Telegram solo se fallisce anche quello"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::error::rilancio non partito"
            exit 1
          fi

      # giro fermato prima del montaggio (controllo della cartella, installazione…): lo script non
      # parte e non può avvisare da solo; lo dice il workflow al bot, con 🔁 Riprova, invece di
      # lasciarlo "in attesa del server" (22-23/10: mirror di Ubuntu fermo, apostrofo nel controllo).
      # Il primo errore del server non scrive: ha già lanciato il secondo giro.
      - name: Avvisa il bot se il giro si è fermato prima di montare
        if: failure() && steps.monta.outcome != 'success' && steps.monta.outcome != 'failure' && steps.chiavi.outcome != 'failure' && steps.check.outputs.mancante != '1' && (steps.causa.outputs.infra != '1' || inputs.tentativo == '2' || steps.rilancio.outputs.ok == '0')
        env:
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          CARTELLA: ${{ steps.check.outputs.cartella || inputs.cartella }}
          RICHIESTO: ${{ inputs.cartella }}
          INSTALLAZIONE: ${{ steps.dipendenze.outcome }}
          USA_IMMAGINE: ${{ vars.USA_IMMAGINE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NOTIFY_URL" ] || exit 0
          if [ "$INSTALLAZIONE" = "failure" ] && [ "$USA_IMMAGINE" = "1" ]; then
            causa="l'immagine del runner non è completa o non si collega: in Variables metti USA_IMMAGINE a 0 per tornare all'installazione di sempre"
          elif [ "$INSTALLAZIONE" = "failure" ]; then
            causa="installazione dei programmi non riuscita (server dei pacchetti di Ubuntu lento o fermo): riprova tra qualche minuto"
          else
            causa="il giro si è fermato prima di cominciare il montaggio (controllo della cartella su Drive): apri il Log per i dettagli"
          fi
          jq -n --arg n "${CARTELLA:-—}" --arg r "$RICHIESTO" --arg u "$RUN_URL" --arg id "$GITHUB_RUN_ID" --arg c "$causa" \
            '{tipo: "esito", esito: "⚠️ non montato", nome: $n, richiesto: $r, ok: false, run_url: $u, run_id: $id, testo: ("Errore: " + $c), info: {errore: $c}}' \
            | curl -s -X POST "$NOTIFY_URL" -H 'content-type: application/json' -H "x-regista-token: $NOTIFY_TOKEN" -d @- > /dev/null || true

      - name: Conserva piano e note (debug)
        if: always() && steps.check.outputs.cartella != ''
        uses: actions/upload-artifact@v4
        with:
          name: lavoro
          path: |
            work/regia.json
            work/piano.json
            work/materiale.json
            work/materiale.md
            work/fogli/*.jpg
            work/NOTE.txt
            work/ERRORE.txt
          if-no-files-found: ignore
          retention-days: 7
