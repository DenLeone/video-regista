name: regista
# nome del giro con la cartella: il 🧭 Capo squadra di Den Squadra riconosce così la fine del montaggio
# (16/11) con «chi» il nome dice anche chi l'ha lanciato: «regista · Fifine AM8 · Revisore» (il bot di Den lo riconosce lo stesso)
run-name: ${{ inputs.cartella && format('regista · {0}{1}', inputs.cartella, inputs.chi && format(' · {0}', inputs.chi) || '') || 'regista' }}

on:
  workflow_dispatch:          # avvio dal bot, dall'app o dal tab Actions
    inputs:
      cartella:
        description: 'Cartella in 01 · Da editare (vuoto = la prima con VAI)'
        required: false
        default: ''
      brief:
        description: 'Brief al volo (aggiunto a brief.txt)'
        required: false
        default: ''
      origine:
        description: '97 = nuovo montaggio da 01 · Da editare, 98 = rifai/correggi un video in 02 · Fatti'
        required: false
        default: '97'
      correzione:
        description: 'Cosa cambiare rispetto al montaggio precedente (solo con origine 98)'
        required: false
        default: ''
      ai:
        description: 'AI principale: gemini | claude (l''altra fa da riserva) — vuoto = variabile REGISTA_AI, poi gemini'
        required: false
        default: ''
      modello:
        description: 'Modello Claude: sonnet | opus | haiku — vuoto = variabile REGISTA_MODEL (default sonnet)'
        required: false
        default: ''
      modello_gemini:
        description: 'Modello Gemini: flash | pro — vuoto = variabile GEMINI_MODEL (default flash)'
        required: false
        default: ''
      azione:
        description: 'monta (default) | elenco = manda solo al bot le cartelle di 01 · Da editare | regia = prova veloce della sola regia (testo, niente render) su una cartella già montata | render = rifà solo il render con la regia salvata (origine 98) | esempi = fogli di fotogrammi degli esempi di uno stile (cartella = nome dello stile) | archivio = copia su Drive i file caricati dall''app, senza montare | squadra = come archivio ma in 05 · Archivio, poi il bot Squadra fa la catena | prepara = analizza il girato appena arrivato su R2, senza montare e senza cancellarlo | kit = niente render: piano e pezzi in piccolo su Drive (_regista/kit) per provare gli stili in pochi secondi (origine 98) | descrizione = riscrive descrizione e 5 hashtag di un video già montato (origine 98) e li manda al bot'
        required: false
        default: 'monta'
      r2:
        description: 'Id del caricamento dall''app (R2). Il runner scarica da lì e copia gli originali in 01 · Da editare'
        required: false
        default: ''
      telegram:
        description: 'File mandati al bot (JSON [{"m": id_messaggio, "n": nome}]): originali in 97/<cartella>, risultato in 98/<cartella>'
        required: false
        default: ''
      secondi:
        description: 'Render di prova: i primi N secondi (es. 20) o un pezzo in mezzo (es. 40-60) del montaggio (vuoto = tutto)'
        required: false
        default: ''
      stili:
        description: 'Confronto: 2 o 3 stili separati da | . Un solo scarico, anteprima da 10 s per ciascuno, poi il video intero nello stile scelto in chat'
        required: false
        default: ''
      macchine:
        description: 'Montaggio su più macchine: 2, 3, 4, 5, 6 o 8 (default 8); 1 = tutto su una macchina, come prima. Vale per monta e render del video intero; prove, correzioni e confronto restano su una'
        required: false
        default: '8'
      tentativo:
        description: 'Interno, non cambiare. 1 = primo giro, 2 = rilancio automatico se il server ha fallito'
        required: false
        default: '1'
      chi:
        description: 'Chi lo lancia, solo per il nome del giro (es. Revisore, Claude). Vuoto = Denis dal bot'
        required: false
        default: ''

# cartelle di Drive (rinominate da Denis il 20/10): le legge anche scripts/cartelle.mjs
# Ultron: preferenza Pro a pagamento (Denis 18/11). Con la chiave a pagamento usa Pro prima di Flash Lite.
env:
  DIR_EDITARE: '01 · Da editare'
  DIR_FATTI: '02 · Fatti'
  DIR_PUBBLICARE: '03 · Da pubblicare'
  DIR_STILI: '12 · Risorse/Stili'
  MOTION_MODELLI_PAGAMENTO: 'gemini-3.8-pro,gemini-pro-latest'

# Una coda PER CARTELLA: GitHub tiene un solo giro "in attesa" per gruppo e scarta
# quelli in attesa più vecchi. Con un gruppo unico, tre avvii di fila ne perdevano uno.
# I render di prova (azione render + secondi) hanno una coda per stile e tratto: più prove della
# stessa cartella girano insieme (10/11); scrivono file con nomi diversi e non toccano il piano salvato.
# Cartelle diverse girano in parallelo. Senza nome di cartella, e l'elenco, hanno la loro coda.
concurrency:
  group: regista-${{ inputs.azione == 'elenco' && 'elenco' || (inputs.azione == 'regia' || inputs.azione == 'esempi' || inputs.azione == 'prepara') && format('{0}-{1}', inputs.azione, inputs.cartella) || (inputs.secondi != '' && inputs.azione == 'render') && format('prova-{0}-{1}-{2}', inputs.cartella, inputs.secondi, inputs.brief) || inputs.cartella || 'auto' }}
  cancel-in-progress: false

# senza nome di cartella, lo script avvia un giro per ogni cartella con VAI (gh workflow run)
permissions:
  contents: read
  actions: write

jobs:
  monta:
    # con più macchine questo job prepara e scrive la regia, poi «pezzo» e «unisci» fanno il resto
    outputs:
      pezzi_cartella: ${{ steps.monta.outputs.pezzi_cartella }}
      pezzi_origine: ${{ steps.monta.outputs.pezzi_origine }}
      pezzi_t0: ${{ steps.monta.outputs.pezzi_t0 }}
    # versione fissa: ubuntu-latest passa a Ubuntu 26 dal 19/10/2026 (ffmpeg, font, dipendenze di Chrome)
    runs-on: ubuntu-24.04
    # un giro fermo (mirror, modello che non risponde) non tiene il runner per 4 ore
    timeout-minutes: 45
    # bash anche dentro l'immagine: gli step usano mapfile. Sulla macchina è già bash.
    defaults:
      run:
        shell: bash
    # Spenta di default. image null = il giro resta sulla macchina, come oggi.
    # Si accende solo con la variabile del repository USA_IMMAGINE=1, quando
    # ghcr.io/denleone/video-regista-runner:latest è pubblica. /mnt è il disco
    # grande; shm da 2g evita che Chrome di Remotion muoia nel container.
    container: ${{ fromJSON(vars.USA_IMMAGINE == '1' && '{"image":"ghcr.io/denleone/video-regista-runner:latest","volumes":["/mnt:/mnt"],"options":"--shm-size=2g"}' || '{"image":null}') }}
    steps:
      - uses: actions/checkout@v5

      # Prima di apt e di Drive: se manca una chiave il giro si ferma subito e Telegram
      # lo dice ora, senza aspettare il quarto d'ora dell'installazione. Non è un errore
      # del server: non si rilancia.
      - name: Chiavi
        id: chiavi
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_GRATIS: ${{ secrets.GEMINI_API_KEY_GRATIS }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NOTIFY_URL: ${{ secrets.NOTIFY_URL }}
          NOTIFY_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AZIONE: ${{ inputs.azione }}
          TELEGRAM: ${{ inputs.telegram }}
          R2: ${{ inputs.r2 }}
          CARTELLA: ${{ inputs.cartella }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          manca=()
          [ -n "$RCLONE_CONF" ] || manca+=("RCLONE_CONF (Drive)")
          if [ "$AZIONE" != "elenco" ] && [ "$AZIONE" != "archivio" ] && [ "$AZIONE" != "squadra" ]; then
            [ -n "$GEMINI_API_KEY" ] || [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || manca+=("GEMINI_API_KEY o CLAUDE_CODE_OAUTH_TOKEN")
            [ -n "$GROQ_API_KEY" ] || manca+=("GROQ_API_KEY")
          fi
          if [ -n "$TELEGRAM" ] && [ "$TELEGRAM" != "[]" ]; then
            [ -n "$TG_API_ID" ] && [ -n "$TG_API_HASH" ] && [ -n "$TELEGRAM_BOT_TOKEN" ] || manca+=("TG_API_ID, TG_API_HASH e TELEGRAM_BOT_TOKEN")
          fi
          if [ -n "$R2" ]; then
            [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_BUCKET" ] || manca+=("R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY e R2_BUCKET")
          fi
          if [ ${#manca[@]} -eq 0 ]; then
            echo "chiavi ok"
            exit 0
          fi
          echo "mancano=1" >> "$GITHUB_OUTPUT"
          testo="Mancano delle chiavi su GitHub Actions: ${manca[*]}. Il giro non parte."
          echo "::error::$testo"
          if [ -n "$NOTIFY_URL" ]; then
            jq -n --arg n "${CARTELLA:-—}" --arg u "$RUN_URL" --arg id "$GITHUB_RUN_ID" --arg t "$testo" \
              '{tipo:"esito", esito:"⚠️ non montato", nome:$n, ok:false, run_url:$u, run_id:$id, testo:("Errore: "+$t), info:{errore:$t}}' \
              | curl -s -X POST "$NOTIFY_URL" -H 'content-type: application/json' -H "x-regista-token: $NOTIFY_TOKEN" -d @- > /dev/null || true
          fi
          exit 1
