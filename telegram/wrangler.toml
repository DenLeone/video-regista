name = "regista-telegram"
main = "src/index.ts"
# account Cloudflare di Denis (non è un segreto: per pubblicare serve il secret CLOUDFLARE_API_TOKEN)
account_id = "5b9821477c750916e6c3f8936a6da859"
compatibility_date = "2026-09-01"

# Memoria del bot (conversazione /nuovo, correzioni in attesa, run -> cartella).
# Durable Object con storage SQLite: si crea con il deploy, niente KV da creare a mano.
[[durable_objects.bindings]]
name = "MEMORIA"
class_name = "Memoria"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Memoria"]

# rinnovo settimanale della chiave Instagram (lunedì mattina, UTC)
[triggers]
crons = ["17 6 * * 1"]

# Segreti (wrangler secret put <NOME>, o dashboard Cloudflare → Variables and Secrets):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_SECRET, ALLOWED_CHAT_ID,
#   GITHUB_TOKEN, GITHUB_REPO, NOTIFY_TOKEN, IG_TOKEN (chiave Instagram per 📤 Pubblica)
