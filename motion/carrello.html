<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Motion · carrello</title>
<style>@font-face{font-family:Inter;src:url("fonts/Inter-var.woff2");font-weight:100 900}
html,body{margin:0;background:transparent;height:100%}canvas{max-width:100vw;max-height:100vh;display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas><script src="params.js"></script><script>
// 🛒 Sponsor (24/11): «Aggiungi al carrello» con una freccia che indica il carrello di TikTok Shop, che sta in basso
// sopra la descrizione. 2 secondi, sfondo trasparente (scripts/carrello.mjs lo mette ogni 5-6 s).
// Tutto dentro le zone (zone.json): y 240–1530, x 60–920. Il test scripts/carrello.test.mjs controlla questi numeri.
window.TOTAL = 2;
const c = document.getElementById('c'), g = c.getContext('2d');
const PILL = { x: 60, y: 1290, w: 560, h: 84 }, PUNTA = 1520, ARANCIO = '#FF6A13';
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
window.renderAt = async (t) => {
  await document.fonts.load('800 40px Inter');
  g.clearRect(0, 0, 1080, 1920);
  const k = ease(t / 0.3), rimbalzo = Math.sin(t * Math.PI * 4) * 12 * ease((t - 0.3) / 0.2);
  g.globalAlpha = k;
  g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 18; g.shadowOffsetY = 6;
  // la scritta
  const y = PILL.y + (1 - k) * 30;
  g.fillStyle = ARANCIO; g.beginPath(); g.roundRect(PILL.x, y, PILL.w, PILL.h, PILL.h / 2); g.fill();
  g.shadowColor = 'transparent'; g.fillStyle = '#fff'; g.font = '800 40px Inter'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText('Aggiungi al carrello', PILL.x + PILL.w / 2, y + PILL.h / 2 + 2);
  // la freccia: verso il basso, sotto la scritta, la punta resta sopra y 1530
  const ax = PILL.x + 90, top = PILL.y + PILL.h + 14 + rimbalzo, punta = PUNTA + rimbalzo - 10;
  g.shadowColor = 'rgba(0,0,0,0.45)'; g.shadowBlur = 18; g.shadowOffsetY = 6;
  g.fillStyle = '#fff'; g.beginPath();
  g.moveTo(ax - 14, top); g.lineTo(ax + 14, top); g.lineTo(ax + 14, punta - 34); g.lineTo(ax + 40, punta - 34);
  g.lineTo(ax, punta); g.lineTo(ax - 40, punta - 34); g.lineTo(ax - 14, punta - 34); g.closePath(); g.fill();
};
</script></body></html>
