<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#F7F3EC"/><stop offset="1" stop-color="#E9E2D5"/>
    </radialGradient>
    <pattern id="strisce" width="96" height="96" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
      <rect width="96" height="96" fill="#2A2724"/><rect width="48" height="96" fill="#F7F3EC"/>
    </pattern>
    <filter id="ombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5A3A28" flood-opacity="0.22"/>
    </filter>
    <clipPath id="barraSotto"><rect x="232" y="372" width="560" height="78" rx="18"/></clipPath>
    <clipPath id="barraSopra"><rect x="232" y="262" width="560" height="78" rx="18"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#fondo)"/>
  <g transform="translate(512 540) scale(1.13) translate(-512 -527)">
  <g filter="url(#ombra)">
    <!-- corpo del ciak -->
    <rect x="232" y="436" width="560" height="356" rx="44" fill="#D97757"/>
    <!-- barra fissa a strisce -->
    <g clip-path="url(#barraSotto)"><rect x="200" y="372" width="640" height="78" fill="url(#strisce)"/></g>
    <!-- asta che si apre, incernierata a sinistra -->
    <g transform="rotate(-14 252 352)">
      <g clip-path="url(#barraSopra)"><rect x="200" y="262" width="640" height="78" fill="url(#strisce)"/></g>
    </g>
    <circle cx="262" cy="404" r="16" fill="#2A2724"/>
  </g>
  <!-- scritte -->
  <text x="512" y="548" text-anchor="middle" font-family="DejaVu Sans" font-size="40" letter-spacing="14" fill="#FBF7F1" opacity="0.85">REGISTA</text>
  <line x1="332" y1="576" x2="692" y2="576" stroke="#FBF7F1" stroke-opacity="0.45" stroke-width="3"/>
  <text x="512" y="742" text-anchor="middle" font-family="Bitstream Charter, DejaVu Serif" font-weight="700" font-size="178" letter-spacing="4" fill="#FBF7F1">DEN</text>
  </g>
</svg>
